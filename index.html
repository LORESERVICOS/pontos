<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<title>Relógio de Ponto Eletrônico</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.19/jspdf.plugin.autotable.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.17.4/xlsx.full.min.js"></script>

<style>
  body{font-family:Inter,system-ui,-apple-system,sans-serif;background:#f8fafc;margin:0}
  header{background:#1e40af;color:#fff;padding:20px;font-size:16px}
  .card{background:#fff;padding:25px;border-radius:14px;box-shadow:0 6px 20px rgba(0,0,0,.05);margin:20px auto}
  button{padding:6px 12px;border-radius:8px;border:none;background:#2563eb;color:#fff;cursor:pointer;margin:2px}
  button:hover{background:#1d4ed8}
  .hidden{display:none}
  table{width:100%;border-collapse:collapse;margin-top:10px}
  th,td{border:1px solid #ddd;padding:8px;text-align:center;font-size:13px}
  th{background:#f1f5f9}
  .verde{color:green;font-weight:bold;}
  input,select{padding:4px 6px;margin:2px 0;}
  .muted{color:#475569;font-size:13px}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:end}
  .row > div{min-width:220px}
  .credito-excedente{background:#0f5132;color:#fff;font-weight:600;}
  .pill{display:inline-block;padding:3px 8px;border-radius:999px;background:#e2e8f0;color:#0f172a;font-size:12px;font-weight:600;}
  @media (max-width:768px){
    header{text-align:center}
    button,input,select{width:100%;margin:4px 0}
    table thead{display:none}
    table tr{display:block;border:1px solid #ddd;margin-bottom:10px;border-radius:8px}
    table td{display:flex;justify-content:space-between;border:none}
    table td::before{content:attr(data-label);font-weight:600}
  }
</style>
</head>

<body>
<header>
  Bem-vindo, <span id="nomeUsuario"></span>
</header>

<!-- LOGIN -->
<div id="loginSection" class="card" style="max-width:400px">
  <h2>Login</h2>
  <input id="username" placeholder="Usuário"><br><br>
  <input id="password" type="password" placeholder="Senha"><br><br>
  <button onclick="login()">Entrar</button>
</div>

<!-- OPERACIONAL -->
<div id="operacionalSection" class="hidden">
  <div class="card" style="max-width:600px">
    <h2>Registro de Ponto</h2>
    <div id="dataAtual"></div>
    <div id="horaAtual"></div>
    <hr>
    <div id="botoesRegistro"></div>
    <hr>
    <h3>Marcações do Dia</h3>
    <div id="registrosUsuario"></div>
    <hr>
    <button onclick="logout()">Sair</button>
  </div>
</div>

<!-- ADMIN -->
<div id="adminSection" class="hidden">
  <div class="card" style="max-width:1200px">
    <h2>Relatório – Cartão de Ponto</h2>

    <button onclick="toggleFolha()">Folha de Pagamento</button>
    <button onclick="logout()">Sair</button>
    <br><br>

    <select id="funcionarioSelect"></select>
    <input type="date" id="dataInicio">
    <input type="date" id="dataFim">
    <select id="tipoRelatorio">
      <option value="simples">Relatório Simples</option>
      <option value="comGeo">Com Geolocalização</option>
    </select>
    <button onclick="gerarRelatorioMensal()">Gerar</button>
    <button onclick="gerarExcel()">Excel</button>
    <button onclick="gerarPDFAdmin()">PDF</button>

    <div id="cartaoFuncionario"></div>

    <!-- FOLHA -->
    <div id="folhaBox" class="hidden" style="margin-top:18px">
      <hr>
      <h2>Folha de Pagamento (CLT)</h2>

      <div class="row">
        <div>
          <label>Funcionário</label><br>
          <select id="folhaFuncionarioSelect"></select>
        </div>

        <div>
          <label>Competência</label><br>
          <input type="month" id="folhaCompetencia">
        </div>

        <div>
          <button onclick="calcularFolha()">Calcular</button>
          <button onclick="exportarExcelFolha()">Excel</button>
          <button onclick="exportarPDFFolha()">PDF</button>
        </div>
      </div>

      <p class="muted" style="margin:8px 0 0 0">
        A folha usa (<span class="pill">FUNCIONARIOS</span>) + (<span class="pill">PONTOS</span>) e salva em <span class="pill">FOLHADEPAGAMENTO</span>.
      </p>

      <div id="folhaResultado" style="margin-top:12px"></div>
    </div>
  </div>
</div>

<script>
/************* ESTADO *************/
let users = {};
let currentUser = null;
let currentUserObj = null;

let periodoCache = {};
let dadosAtual = {};
let dataAtualRel = "";

const feriados = ["01/01","07/09","25/12"];

/************* API (SEM CORS) *************/
function apiPost(payload){
  return new Promise((resolve, reject) => {
    google.script.run
      .withSuccessHandler(resolve)
      .withFailureHandler(err => reject(err))
      .api(payload);
  });
}

/************* HELPERS *************/
function capitalize(s){ return s ? s.charAt(0).toUpperCase()+s.slice(1) : ""; }
function hm(h){ if(!h || typeof h!=="string" || !h.includes(":")) return 0; const [x,y]=h.split(":").map(Number); return (x*60)+(y||0); }
function fmt(m){ const abs=Math.max(0,Math.round(m||0)); return `${String(Math.floor(abs/60)).padStart(2,"0")}:${String(abs%60).padStart(2,"0")}`; }
function dateToBR_(dt){ return `${String(dt.getDate()).padStart(2,"0")}/${String(dt.getMonth()+1).padStart(2,"0")}/${dt.getFullYear()}`; }
function parseInputDateLocal(str){ if(!str) return null; const [a,m,d]=str.split("-").map(Number); return new Date(a,m-1,d); }
function formataHoraCelula(valor){
  if (!valor) return "";
  if (valor instanceof Date) return `${String(valor.getHours()).padStart(2,"0")}:${String(valor.getMinutes()).padStart(2,"0")}`;
  const s = String(valor).trim();
  if (!s) return "";
  if (s.toUpperCase() === "FOLGA") return "FOLGA";
  const m = s.match(/(\d{1,2}):(\d{2})/);
  if (m) return `${String(Number(m[1])).padStart(2,"0")}:${m[2]}`;
  return s;
}
function moeda(v){ return Number(v||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"}); }
function horas(min){ const m=Math.max(0,Math.round(min||0)); return `${String(Math.floor(m/60)).padStart(2,"0")}:${String(m%60).padStart(2,"0")}`; }

/************* LOGIN *************/
async function login(){
  const u = document.getElementById("username").value.trim();
  const p = document.getElementById("password").value.trim();
  if(!u || !p){ alert("Preencha usuário e senha."); return; }

  let res;
  try{
    res = await apiPost({ tipo:"login", usuario:u, senha:p });
  }catch(e){
    alert("Erro ao conectar com o servidor: " + (e?.message || e));
    return;
  }

  if(!res || res.status !== "ok"){
    alert(res?.message || "Usuário ou senha inválidos.");
    return;
  }

  const user = res.user || {};
  const loginKey = (user.usuario_login || u).toString().trim().toLowerCase();

  currentUser = loginKey;
  currentUserObj = user;

  document.getElementById("nomeUsuario").textContent = user.nomeCompleto || user.nome || loginKey;
  document.getElementById("loginSection").classList.add("hidden");

  if((user.role || "").toLowerCase() === "admin"){
    document.getElementById("adminSection").classList.remove("hidden");
    await carregarUsuariosAdmin();
    preencherFuncionarios();
  }else{
    document.getElementById("operacionalSection").classList.remove("hidden");
    mostrarDataHora();
    mostrarRegistrosUsuario();
  }
}

function logout(){ location.reload(); }

async function carregarUsuariosAdmin(){
  const res = await apiPost({ tipo:"listarUsuarios" });
  users = {};
  (res.usuarios || []).forEach(u=>{
    const k = (u.usuario_login||"").toLowerCase();
    if(!k) return;
    users[k] = { ...u, role:(u.role||"operacional").toLowerCase(), nomeCompleto: u.nomeCompleto || u.nome || k };
  });
}

function preencherFuncionarios(){
  const select = document.getElementById("funcionarioSelect");
  select.innerHTML = "<option value=''>Selecionar Funcionário</option>";
  Object.keys(users).forEach(u=>{
    if(users[u].role==="operacional"){
      const opt = document.createElement("option");
      opt.value = u;
      opt.textContent = users[u].nomeCompleto || u;
      select.appendChild(opt);
    }
  });
}

/************* OPERACIONAL *************/
function mostrarDataHora(){
  setInterval(()=>{
    const a=new Date();
    document.getElementById("dataAtual").textContent="Data: "+dateToBR_(a);
    document.getElementById("horaAtual").textContent="Hora: "+a.toLocaleTimeString("pt-BR");
  },1000);
}

async function registrar(tipo){
  const agora = new Date();
  const hora = agora.toTimeString().slice(0,5);
  const data = dateToBR_(agora);

  let geo = "Não registrada";
  if(navigator.geolocation){
    geo = await new Promise((resolve)=>{
      navigator.geolocation.getCurrentPosition(
        pos => resolve(`${pos.coords.latitude.toFixed(5)}, ${pos.coords.longitude.toFixed(5)}`),
        err => {
          if(err?.code===1) resolve("Permissão negada");
          else if(err?.code===2) resolve("Posição indisponível");
          else if(err?.code===3) resolve("Tempo esgotado");
          else resolve("Não registrada");
        },
        { enableHighAccuracy:true, timeout:15000, maximumAge:0 }
      );
    });
  }

  const res = await apiPost({ tipo:"registroPonto", usuario_login: currentUser, data, marcacao: tipo, hora, geo });
  if(res.status !== "ok"){ alert(res.message || "Erro ao registrar"); return; }
  await mostrarRegistrosUsuario();
}

async function mostrarRegistrosUsuario(){
  const hoje = new Date().toLocaleDateString("pt-BR");
  const registrosDiv = document.getElementById("registrosUsuario");
  const botoesDiv = document.getElementById("botoesRegistro");

  registrosDiv.innerHTML = "Carregando...";
  botoesDiv.innerHTML = "";

  const res = await apiPost({ tipo:"getDia", usuario_login: currentUser, data: hoje });
  const r = (res && res.status==="ok" && res.dia) ? res.dia : {};

  registrosDiv.innerHTML = "";
  const campos = [["entrada","Entrada"],["saidaAlmoco","Saída Almoço"],["retornoAlmoco","Retorno"],["saida","Saída"]];
  campos.forEach(([k,label])=>{
    const v = r[k];
    if(v && String(v).trim() && String(v).trim() !== "-"){
      registrosDiv.innerHTML += `<div style="padding:6px 0;border-bottom:1px solid #eee;"><b>${label}:</b> ${formataHoraCelula(v)}</div>`;
    }
  });

  if(!r.entrada) botoesDiv.innerHTML = `<button onclick="registrar('entrada')">Entrada</button>`;
  else if(!r.saidaAlmoco) botoesDiv.innerHTML = `<button onclick="registrar('saidaAlmoco')">Saída Almoço</button>`;
  else if(!r.retornoAlmoco) botoesDiv.innerHTML = `<button onclick="registrar('retornoAlmoco')">Retorno</button>`;
  else if(!r.saida) botoesDiv.innerHTML = `<button onclick="registrar('saida')">Saída</button>`;
  else botoesDiv.innerHTML = "✅ Jornada finalizada";
}

/************* ADMIN – CARTÃO DE PONTO *************/
async function gerarRelatorioMensal(){
  const u = document.getElementById("funcionarioSelect").value;
  const dataInicioEl = document.getElementById("dataInicio");
  const dataFimEl = document.getElementById("dataFim");
  const tipo = document.getElementById("tipoRelatorio").value;

  if(!u || !dataInicioEl.value) return;

  const inicio = parseInputDateLocal(dataInicioEl.value);
  const fim = dataFimEl.value ? parseInputDateLocal(dataFimEl.value) : inicio;
  if(!inicio || !fim){ alert("Preencha corretamente as datas."); return; }

  const periodoInicioStr = dateToBR_(inicio);
  const periodoFimStr = dateToBR_(fim);

  const resPeriodo = await apiPost({
    tipo: "getPeriodo",
    usuario_login: u,
    dataInicio: periodoInicioStr,
    dataFim: periodoFimStr
  });

  if(!resPeriodo || resPeriodo.status !== "ok"){
    alert(resPeriodo?.message || "Erro ao carregar período");
    return;
  }

  periodoCache = resPeriodo.registros || {};

  let html = "";
  html += `<h3>Cartão de Ponto – ${users[u]?.nomeCompleto || u}</h3>`;
  html += `<p>PIS: ${users[u]?.pis || ""}</p>`;
  html += `<p>Período: ${periodoInicioStr} até ${periodoFimStr}</p>`;

  html += `<table id="tabelaRelatorio"><tr>
    <th>Data</th><th>Entrada</th><th>Saída Almoço</th><th>Retorno</th><th>Saída</th><th>Total</th>`;

  if(tipo==="comGeo"){
    html += `<th>Geo Entrada</th><th>Geo Saída Almoço</th><th>Geo Retorno</th><th>Geo Saída</th>`;
  }
  html += `</tr>`;

  let somaTotalMin = 0;

  let cur = new Date(inicio);
  while(cur <= fim){
    const dBR = dateToBR_(cur);
    const dia = periodoCache[dBR] || {};
    const ent = formataHoraCelula(dia.entrada);
    const sAl = formataHoraCelula(dia.saidaAlmoco);
    const ret = formataHoraCelula(dia.retornoAlmoco);
    const sai = formataHoraCelula(dia.saida);

    let totalMin = 0;
    if(ent && sai){
      if(sAl && ret){
        totalMin = (hm(sAl)-hm(ent)) + (hm(sai)-hm(ret));
      }else{
        totalMin = hm(sai)-hm(ent);
      }
      if(totalMin < 0) totalMin = 0;
    }
    somaTotalMin += totalMin;

    html += `<tr>
      <td>${dBR}</td>
      <td>${ent||""}</td>
      <td>${sAl||""}</td>
      <td>${ret||""}</td>
      <td>${sai||""}</td>
      <td class="verde">${fmt(totalMin)}</td>`;

    if(tipo==="comGeo"){
      html += `<td>${dia.geoEntrada||""}</td>
               <td>${dia.geoSaidaAlmoco||""}</td>
               <td>${dia.geoRetornoAlmoco||""}</td>
               <td>${dia.geoSaida||""}</td>`;
    }

    html += `</tr>`;
    cur.setDate(cur.getDate()+1);
  }

  html += `<tr><th colspan="${tipo==="comGeo" ? 5 : 5}">TOTAL</th><th class="verde">${fmt(somaTotalMin)}</th>`;
  if(tipo==="comGeo") html += `<th colspan="4"></th>`;
  html += `</tr></table>`;

  document.getElementById("cartaoFuncionario").innerHTML = html;
}

function gerarExcel(){
  const tabela = document.querySelector("#tabelaRelatorio");
  if(!tabela){ alert("Gere o cartão antes."); return; }

  const wb = XLSX.utils.book_new();
  const linhas = [];
  tabela.querySelectorAll("tr").forEach(tr=>{
    const row = [];
    tr.querySelectorAll("th,td").forEach(cell=> row.push((cell.innerText||"").trim()));
    linhas.push(row);
  });

  const ws = XLSX.utils.aoa_to_sheet(linhas);
  XLSX.utils.book_append_sheet(wb, ws, "Cartão de Ponto");
  XLSX.writeFile(wb, "cartao_ponto.xlsx");
}

function gerarPDFAdmin(){
  const tabela = document.querySelector("#tabelaRelatorio");
  if(!tabela){ alert("Gere o cartão antes."); return; }
  const {jsPDF}=window.jspdf;
  const doc=new jsPDF('p','mm','a4');
  doc.setFontSize(12);
  doc.text("RELATÓRIO DE PONTO",105,10,{align:"center"});
  doc.autoTable({startY:18,html:tabela});
  doc.save("cartao_ponto.pdf");
}

/************* FOLHA (ADMIN) *************/
function toggleFolha(){
  const box = document.getElementById("folhaBox");
  box.classList.toggle("hidden");

  const src = document.getElementById("funcionarioSelect");
  const dst = document.getElementById("folhaFuncionarioSelect");

  if(src && dst){
    dst.innerHTML = src.innerHTML;
    if(src.value) dst.value = src.value; // ✅ mesmo funcionário
  }

  const comp = document.getElementById("folhaCompetencia");
  const di = document.getElementById("dataInicio")?.value; // yyyy-mm-dd
  if(comp){
    if(di) comp.value = di.slice(0,7);
    else if(!comp.value){
      const now = new Date();
      comp.value = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,"0")}`;
    }
  }

  if(!box.classList.contains("hidden")){
    document.getElementById("folhaResultado").innerHTML = "";
  }
}

async function calcularFolha(){
  const u = document.getElementById("folhaFuncionarioSelect")?.value || "";
  const comp = document.getElementById("folhaCompetencia")?.value || "";
  if(!u || !comp){ alert("Selecione funcionário e competência."); return; }

  const res = await apiPost({ tipo:"calcularFolha", usuario_login: u, competencia: comp });
  if(!res || res.status !== "ok"){ alert(res?.message || "Erro ao calcular folha."); return; }
  renderFolha(res);
}

function renderFolha(res){
  const nome = users[res.usuario_login]?.nomeCompleto || res.usuario_login;

  document.getElementById("folhaResultado").innerHTML = `
    <h3>Folha – ${nome} (${res.competencia})</h3>
    <table id="tabelaFolha">
      <tr><th colspan="2">Proventos</th></tr>
      <tr><td>Salário Base</td><td>${moeda(res.salario_base)}</td></tr>
      <tr><td>Hora extra 50% (${horas(res.he50_min)})</td><td>${moeda(res.he50_val)}</td></tr>
      <tr><td>Hora extra 100% (${horas(res.he100_min)})</td><td>${moeda(res.he100_val)}</td></tr>
      <tr><td>Outros Proventos</td><td>${moeda(res.outros_proventos)}</td></tr>
      <tr><th>Bruto</th><th>${moeda(res.bruto)}</th></tr>

      <tr><th colspan="2">Descontos</th></tr>
      <tr><td>Faltas/Atrasos (${horas(res.faltas_min)})</td><td>${moeda(res.faltas_val)}</td></tr>
      <tr><td>INSS</td><td>${moeda(res.inss)}</td></tr>
      <tr><td>IRRF</td><td>${moeda(res.irrf)}</td></tr>
      <tr><td>VT (${res.vt_percent ?? 0}%)</td><td>${moeda(res.vt)}</td></tr>
      <tr><td>Outros Descontos</td><td>${moeda(res.outros_descontos)}</td></tr>
      <tr><th>Total Descontos</th><th>${moeda(res.descontos)}</th></tr>

      <tr><th>Líquido</th><th>${moeda(res.liquido)}</th></tr>
    </table>

    <p class="muted" style="margin-top:8px">
      Valor hora: <b>${moeda(res.valor_hora)}</b> • Base IR: <b>${moeda(res.base_ir)}</b> • Dep. IR: <b>${res.dep_ir ?? 0}</b>
    </p>
  `;
}

function exportarExcelFolha(){
  const tabela = document.querySelector("#tabelaFolha");
  if(!tabela){ alert("Calcule a folha antes de exportar."); return; }
  const wb = XLSX.utils.book_new();
  const linhas = [];
  tabela.querySelectorAll("tr").forEach(tr=>{
    const row = [];
    tr.querySelectorAll("th,td").forEach(td=> row.push((td.innerText||"").trim()));
    linhas.push(row);
  });
  const ws = XLSX.utils.aoa_to_sheet(linhas);
  XLSX.utils.book_append_sheet(wb, ws, "Folha");
  XLSX.writeFile(wb, "folha_pagamento.xlsx");
}

function exportarPDFFolha(){
  const tabela = document.querySelector("#tabelaFolha");
  if(!tabela){ alert("Calcule a folha antes de exportar."); return; }
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF('p','mm','a4');
  doc.setFontSize(12);
  doc.text("FOLHA DE PAGAMENTO (CLT)", 105, 10, {align:"center"});
  doc.autoTable({ startY: 18, html: tabela });
  doc.save("folha_pagamento.pdf");
}
</script>
</body>
</html>
